/* ─── Claude API ───────────────────────────────────────────────────── */
async function callClaude(system,user,apiKey){
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,system,messages:[{role:"user",content:user}]})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||"HTTP "+res.status);}
  const d=await res.json();
  return d.content?.map(b=>b.text||"").join("")||"";
}

async function runAnalysis(resume,jd,apiKey){
  const sys=`You are an expert ATS analyst and UK career coach. Analyse the resume against the job description. Return ONLY valid JSON, no markdown, no backticks. Schema: {"score":<0-100>,"summary":"<2 sentences>","missingKeywords":["kw1","kw2"],"presentKeywords":["kw1","kw2"],"topSkillsRequired":["s1","s2","s3","s4","s5"],"alterations":[{"section":"name","issue":"what is wrong","suggestion":"exact fix"}],"strengths":["s1","s2","s3"],"quickWins":["w1","w2","w3"]}`;
  const raw=await callClaude(sys,"RESUME:\n"+resume+"\n\nJOB DESCRIPTION:\n"+jd,apiKey);
  try{return JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{return null;}
}

function ScoreRing({score}){
  const r=46,c=2*Math.PI*r,dash=c*(score/100);
  const col=score>=75?"#1d6b3e":score>=50?"#d97706":"#dc2626";
  return(
    <svg width="112" height="112" viewBox="0 0 112 112">
      <circle cx="56" cy="56" r={r} fill="none" stroke="#e4e2dc" strokeWidth="10"/>
      <circle cx="56" cy="56" r={r} fill="none" stroke={col} strokeWidth="10" strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform="rotate(-90 56 56)" style={{transition:"stroke-dasharray 1.2s ease"}}/>
      <text x="56" y="52" textAnchor="middle" fontSize="22" fontWeight="800" fill={col} fontFamily="Syne,sans-serif">{score}</text>
      <text x="56" y="66" textAnchor="middle" fontSize="9" fill="#6b6b65" fontFamily="Instrument Sans,sans-serif">ATS SCORE</text>
    </svg>
  );
}

/* ─── JOB BOARD VIEW ───────────────────────────────────────────────── */
function JobBoardView({apiKey,onTrackJob}){
  const [search,setSearch]=useState("");
  const [category,setCategory]=useState("All Roles");
  const [location,setLocation]=useState("All UK");
  const [jobType,setJobType]=useState("All Types");
  const [selectedJob,setSelectedJob]=useState(null);
  const [analysing,setAnalysing]=useState(false);
  const [matchResult,setMatchResult]=useState(null);
  const [showMatchModal,setShowMatchModal]=useState(false);
  const [resume,setResume]=useState(()=>S.get("rr_resume")||"");
  const [countdown,setCountdown]=useState(300);
  const [liveJobs,setLiveJobs]=useState([]);
  const [jobsLoading,setJobsLoading]=useState(false);
  const [jobsError,setJobsError]=useState("");
  const [usingLive,setUsingLive]=useState(false);
  const adzunaAppId=S.get("rr_adzuna_id")||"";
  const adzunaKey=S.get("rr_adzuna_key")||"";
  const [showApiSetup,setShowApiSetup]=useState(false);
  const [tempId,setTempId]=useState(adzunaAppId);
  const [tempKey,setTempKey]=useState(adzunaKey);

  // Countdown timer
  useEffect(()=>{
    const t=setInterval(()=>{
      setCountdown(c=>{
        if(c<=1){
          if(adzunaAppId&&adzunaKey) fetchLiveJobs();
          return 300;
        }
        return c-1;
      });
    },1000);
    return ()=>clearInterval(t);
  },[adzunaAppId,adzunaKey]);

  // Auto-fetch if keys exist
  useEffect(()=>{
    if(adzunaAppId&&adzunaKey) fetchLiveJobs();
  },[]);

  async function fetchLiveJobs(){
    if(!adzunaAppId||!adzunaKey){setUsingLive(false);return;}
    setJobsLoading(true);setJobsError("");
    try{
      const q=search||"marketing CRM salesforce";
      const loc=location==="All UK"?"gb":location.toLowerCase().replace(" uk","").replace(" ","_");
      const url=`https://api.adzuna.com/v1/api/jobs/gb/search/1?app_id=${adzunaAppId}&app_key=${adzunaKey}&results_per_page=20&what=${encodeURIComponent(q)}&content-type=application/json`;
      const res=await fetch(url);
      if(!res.ok) throw new Error("Adzuna API error "+res.status);
      const data=await res.json();
      const jobs=(data.results||[]).map(j=>({
        id:j.id,
        title:j.title,
        company:j.company?.display_name||"Unknown Company",
        location:j.location?.display_name||"UK",
        type:"Full-time",
        salary:j.salary_min&&j.salary_max?`£${Math.round(j.salary_min/1000)}k–£${Math.round(j.salary_max/1000)}k`:j.salary_min?`From £${Math.round(j.salary_min/1000)}k`:"Salary not listed",
        source:"Adzuna",
        posted:new Date(j.created).toLocaleDateString("en-GB"),
        tags:(j.category?.label?[j.category.label]:[]).concat(j.title.split(" ").filter(w=>w.length>4).slice(0,3)),
        remote:j.title.toLowerCase().includes("remote")?"Remote":j.title.toLowerCase().includes("hybrid")?"Hybrid":"On-site",
        featured:false,
        url:j.redirect_url,
        description:j.description||"",
      }));
      setLiveJobs(jobs);
      setUsingLive(true);
    }catch(e){
      setJobsError("Could not load live jobs: "+e.message);
      setUsingLive(false);
    }
    setJobsLoading(false);
  }

  function saveAdzunaKeys(){
    S.set("rr_adzuna_id",tempId);
    S.set("rr_adzuna_key",tempKey);
    setShowApiSetup(false);
    window.location.reload();
  }

  const mm=Math.floor(countdown/60),ss=countdown%60;

  const allJobs=usingLive?liveJobs:MOCK_JOBS;

  const filtered=allJobs.filter(j=>{
    const q=search.toLowerCase();
    const tags=Array.isArray(j.tags)?j.tags:[];
    const matchQ=!q||(j.title+j.company+tags.join(" ")).toLowerCase().includes(q);
    const matchL=location==="All UK"||j.location?.includes(location.replace(" UK",""))||j.remote===location.replace(" UK","");
    const matchT=jobType==="All Types"||j.type===jobType;
    const matchC=category==="All Roles"||tags.some(t=>t.toLowerCase().includes(category.toLowerCase().split(" ")[0].toLowerCase()));
    return matchQ&&matchL&&matchT&&matchC;
  });

  async function matchWithResume(job){
    if(!resume.trim()){alert("Please save your resume in the Resume Scanner tab first, or paste it when prompted.\n\nClick the Resume Scanner tab to add your resume.");return;}
    setAnalysing(true);setMatchResult(null);setSelectedJob(job);setShowMatchModal(true);
    try{
      const r=await runAnalysis(resume,`Job Title: ${job.title}\nCompany: ${job.company}\nLocation: ${job.location}\nTags/Skills: ${job.tags.join(", ")}\nType: ${job.type}\nSalary: ${job.salary}`,apiKey);
      setMatchResult(r);
    }catch(e){alert("Analysis error: "+e.message);}
    setAnalysing(false);
  }

  const remoteBadge=(r)=>{
    const colors={Remote:{bg:"#dcfce7",c:"#166534"},Hybrid:{bg:"#dbeafe",c:"#1e40af"},"On-site":{bg:"#f0f0eb",c:"#444440"}};
    const s=colors[r]||colors["On-site"];
    return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 8px",borderRadius:"999px",fontSize:"11px",fontWeight:600,background:s.bg,color:s.c}}>{r}</span>;
  };

  return(
    <div style={{animation:"fadeUp 0.3s ease"}}>
      {/* Search bar */}
      <div style={{background:"#fff",borderRadius:"14px",border:"1.5px solid var(--border)",padding:"16px 20px",marginBottom:"16px",boxShadow:"var(--shadow)"}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",gap:"10px",alignItems:"end"}}>
          <div>
            <label style={lbl}>Search Jobs</label>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Job title, skill, company..." style={{...inp,fontSize:"14px",padding:"11px 14px"}}/>
          </div>
          <div style={{minWidth:"160px"}}>
            <label style={lbl}>Location</label>
            <select value={location} onChange={e=>setLocation(e.target.value)} style={inp}>
              {UK_LOCATIONS.map(l=><option key={l}>{l}</option>)}
            </select>
          </div>
          <div style={{minWidth:"140px"}}>
            <label style={lbl}>Job Type</label>
            <select value={jobType} onChange={e=>setJobType(e.target.value)} style={inp}>
              {JOB_TYPES.map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <button style={{...btnPrimary,padding:"10px 22px",marginTop:"18px"}}>Search</button>
        </div>
      </div>

      {/* Category pills */}
      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"16px",overflowX:"auto",paddingBottom:"4px"}}>
        {UK_CATEGORIES.map(c=>(

                <div style={{marginBottom:"16px"}}>

                  <div>{matchResult.missingKeywords?.map(k=><Pill key={k} label={k} v="red"/>)}</div>
                </div>
                <div style={{marginBottom:"16px"}}>
                  <p style={{fontSize:"12px",fontWeight:700,color:"var(--muted)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:"8px"}}>Quick Wins</p>
                  {matchResult.quickWins?.map((w,i)=>(
                    <div key={i} style={{display:"flex",gap:"10px",padding:"10px 12px",background:"var(--bg)",borderRadius:"8px",marginBottom:"6px",fontSize:"13px"}}>

                <div style={{display:"flex",gap:"10px",marginTop:"20px"}}>

              </div>
            )}
          </>
        )}
      </Modal>
    </div>
  );
}

/* ─── RESUME SCANNER VIEW ──────────────────────────────────────────── */
function ResumeView({apiKey}){
  const [resume,setResume]=useState(()=>S.get("rr_resume")||"");
  const [jd,setJd]=useState("");
  const [title,setTitle]=useState("");
  const [company,setCompany]=useState("");
  const [loading,setLoading]=useState(false);
  const [res,setRes]=useState(null);
  const [err,setErr]=useState("");
  const [resumeSaved,setResumeSaved]=useState(!!S.get("rr_resume"));
  const [uploading,setUploading]=useState(false);
  const [uploadName,setUploadName]=useState("");
  const fileRef=useRef(null);

  function saveResume(){S.set("rr_resume",resume);setResumeSaved(true);setTimeout(()=>setResumeSaved(false),2000);}

  async function handleFile(e){
    const file=e.target.files?.[0];
    if(!file) return;
    setUploading(true);setUploadName(file.name);setErr("");
    try{
      if(file.type==="application/pdf"||file.name.endsWith(".pdf")){
        // Extract text from PDF using pdf.js
        const arrayBuffer=await file.arrayBuffer();
        const pdfjsLib=window["pdfjs-dist/build/pdf"];
        pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
        let text="";
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          text+=content.items.map(item=>item.str).join(" ")+"\n";
        }
        setResume(text.trim());
      } else if(file.name.endsWith(".docx")||file.name.endsWith(".doc")){
        // For DOCX: read as text (basic extraction)
        const text=await file.text();
        // Strip XML tags for basic docx text
        const clean=text.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
        setResume(clean.length>100?clean:"Could not extract DOCX text automatically. Please paste your resume text manually below.");
      } else if(file.type==="text/plain"||file.name.endsWith(".txt")){
        const text=await file.text();
        setResume(text);
      } else {
        setErr("Supported formats: PDF, DOCX, TXT. Please upload one of these or paste your resume text.");
      }
    }catch(ex){
      setErr("Could not read file: "+ex.message+". Please paste your resume text manually.");
    }
    setUploading(false);
  }

  async function analyse(){
    if(!resume.trim()||!jd.trim()){setErr("Please add your resume and paste the job description.");return;}
    setErr("");setLoading(true);setRes(null);
    try{
      const r=await runAnalysis(resume,jd,apiKey);
      setLoading(false);
      if(!r){setErr("Analysis failed — please try again.");return;}
      setRes(r);
    }catch(e){setLoading(false);setErr("Error: "+e.message);}
  }

  return(
    <div style={{animation:"fadeUp 0.3s ease"}}>
      <div style={{marginBottom:"28px"}}>
        <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"28px",fontWeight:800,letterSpacing:"-0.03em",margin:"0 0 6px"}}>Resume Scanner</h2>
        <p style={{color:"var(--muted)",fontSize:"14px"}}>Upload your CV or paste it — get your ATS score, missing keywords, and exact edits for UK jobs.</p>
      </div>

      {/* Upload + Save Resume card */}
      <div style={{background:"#fff",borderRadius:"14px",border:"1.5px solid var(--border)",padding:"20px",marginBottom:"20px",boxShadow:"var(--shadow)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px",flexWrap:"wrap",gap:"10px"}}>
          <div>
            <h4 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"15px",margin:"0 0 3px"}}>Your Resume / CV</h4>
            <p style={{fontSize:"12px",color:"var(--muted)"}}>Upload a file or paste text — saved resume is used for AI match scores across the job board</p>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            <input ref={fileRef} type="file" accept=".pdf,.docx,.doc,.txt" onChange={handleFile} style={{display:"none"}}/>
            <button onClick={()=>fileRef.current?.click()} style={{...btnGhost,padding:"8px 16px",fontSize:"13px",display:"flex",alignItems:"center",gap:"6px",borderColor:"var(--accent)",color:"var(--accent)"}}>
              {uploading?"Reading file...":"Upload PDF / DOCX / TXT"}
            </button>
            <button onClick={saveResume} style={{...btnPrimary,padding:"8px 18px",fontSize:"13px"}}>
              {resumeSaved?"✓ Saved!":"Save Resume"}
            </button>
          </div>
        </div>

        {/* Upload zone */}
        <div
          onClick={()=>fileRef.current?.click()}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files?.[0];if(f){const dt=new DataTransfer();dt.items.add(f);fileRef.current.files=dt.files;handleFile({target:{files:dt.files}});}}}
          style={{border:"2px dashed var(--border)",borderRadius:"10px",padding:"20px",textAlign:"center",cursor:"pointer",marginBottom:"12px",background:"var(--bg)",transition:"border-color 0.2s"}}
        >
          {uploading?(
            <div><div style={{fontSize:"28px",display:"inline-block",animation:"spin 1.2s linear infinite"}}>⚙</div><p style={{fontSize:"13px",color:"var(--muted)",marginTop:"8px"}}>Reading {uploadName}...</p></div>
          ):uploadName?(
            <div><div style={{fontSize:"28px"}}>✅</div><p style={{fontSize:"13px",color:"var(--accent)",marginTop:"6px",fontWeight:600}}>{uploadName} loaded successfully</p><p style={{fontSize:"12px",color:"var(--muted)"}}>Click to upload a different file</p></div>
          ):(
            <div><div style={{fontSize:"32px",marginBottom:"8px"}}>📄</div><p style={{fontSize:"13px",fontWeight:600,color:"var(--text)"}}>Drop your CV here or click to browse</p><p style={{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}}>PDF, DOCX, or TXT — max 10MB</p></div>
          )}
        </div>

        <textarea value={resume} onChange={e=>setResume(e.target.value)} placeholder="Or paste your resume / CV text here directly..." style={{...txta,height:"110px",fontSize:"13px"}}/>
      </div>

      {/* Analysis section */}
      <div style={{background:"#fff",borderRadius:"14px",border:"1.5px solid var(--border)",padding:"24px",boxShadow:"var(--shadow)"}}>
        <h4 style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"16px",margin:"0 0 16px"}}>Analyse Against a Specific Job</h4>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"16px"}}>
          <div><label style={lbl}>Job Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. SFMC Consultant" style={inp}/></div>
          <div><label style={lbl}>Company</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="e.g. Accenture" style={inp}/></div>
        </div>
        <div style={{marginBottom:"16px"}}>
          <label style={lbl}>Job Description</label>
          <textarea value={jd} onChange={e=>setJd(e.target.value)} placeholder="Paste the full job description here..." style={{...txta,height:"180px"}}/>
        </div>
        {err&&<div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:"8px",padding:"12px",marginBottom:"14px",fontSize:"13px",color:"var(--red)"}}>{err}</div>}
        <button onClick={analyse} disabled={loading} style={{...btnPrimary,opacity:loading?0.7:1}}>
          {loading?"Analysing...":"Analyse My Resume"}
        </button>
      </div>

      {loading&&(
        <div style={{textAlign:"center",padding:"56px 0",color:"var(--muted)"}}>
          <div style={{fontSize:"36px",display:"inline-block",animation:"spin 1.2s linear infinite"}}>⚙</div>
          <p style={{marginTop:"14px",fontWeight:600}}>Running ATS analysis...</p>
          <p style={{fontSize:"12px",color:"var(--muted)",marginTop:"4px"}}>Checking keywords, skills, formatting. 10-20 seconds.</p>
        </div>
      )}

      {res&&(
        <div style={{marginTop:"24px",animation:"fadeUp 0.4s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:"32px",flexWrap:"wrap",background:"#fff",border:"1.5px solid var(--border)",borderRadius:"14px",padding:"28px",marginBottom:"20px",boxShadow:"var(--shadow)"}}>
            <ScoreRing score={res.score}/>
            <div style={{flex:1,minWidth:"220px"}}>
              <h3 style={{fontFamily:"'Syne',sans-serif",fontSize:"20px",fontWeight:800,margin:"0 0 8px",letterSpacing:"-0.02em"}}>{res.score>=75?"Strong match - you are competitive":res.score>=50?"Decent match - targeted edits will help":"Needs work - significant gaps"}</h3>
              <p style={{color:"var(--muted)",fontSize:"14px",lineHeight:1.6}}>{res.summary}</p>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginBottom:"14px"}}>
            {[{title:"Keywords Present",items:res.presentKeywords?.slice(0,10),v:"green"},{title:"Missing Keywords - Add These",items:res.missingKeywords,v:"red"}].map(s=>(
              <div key={s.title} style={{background:"#fff",borderRadius:"12px",border:"1.5px solid var(--border)",padding:"18px"}}>
                <p style={{...lbl,marginBottom:"10px"}}>{s.title}</p>
                <div>{s.items?.map(k=><Pill key={k} label={k} v={s.v}/>)}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#fff",borderRadius:"12px",border:"1.5px solid var(--border)",padding:"18px",marginBottom:"14px"}}>
            <p style={{...lbl,marginBottom:"10px"}}>Top Skills Required</p>
            <div>{res.topSkillsRequired?.map(s=><Pill key={s} label={s} v="blue"/>)}</div>
          </div>
          <div style={{background:"#fff",borderRadius:"12px",border:"1.5px solid var(--border)",padding:"18px",marginBottom:"14px"}}>
            <p style={{...lbl,marginBottom:"10px"}}>Quick Wins - Do These First</p>
            {res.quickWins?.map((w,i)=>(
              <div key={i} style={{display:"flex",gap:"10px",padding:"10px 12px",background:"var(--bg)",borderRadius:"8px",marginBottom:"6px",fontSize:"13px"}}>
                <span style={{background:"var(--accent2)",color:"var(--accent)",borderRadius:"50%",width:"20px",height:"20px",display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:"11px",flexShrink:0}}>{i+1}</span>{w}
              </div>
            ))}
          </div>
          <div style={{background:"#fff",borderRadius:"12px",border:"1.5px solid var(--border)",padding:"18px",marginBottom:"14px"}}>
            <p style={{...lbl,marginBottom:"10px"}}>Suggested Alterations</p>
            {res.alterations?.map((a,i)=>(
              <div key={i} style={{padding:"12px 14px",background:"var(--bg)",borderRadius:"8px",marginBottom:"8px"}}>
                <div style={{marginBottom:"5px"}}><Pill label={a.section} v="amber"/></div>
                <p style={{margin:"0 0 3px",color:"var(--muted)",fontSize:"12px"}}><b>Issue:</b> {a.issue}</p>
                <p style={{margin:0,fontSize:"13px"}}><b>Fix:</b> {a.suggestion}</p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── AI NINJA (chat) VIEW ─────────────────────────────────────────── */
function AINinjaView({apiKey}){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Hi! I am your AI career assistant. Ask me anything about your resume, cover letters, interview prep, UK job market, or salary negotiation."}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  async function send(){
    if(!input.trim()||loading) return;
    const userMsg={role:"user",content:input.trim()};
    setMsgs(m=>[...m,userMsg]);setInput("");setLoading(true);
    try{
      const history=msgs.concat(userMsg).map(m=>({role:m.role,content:m.content}));
      const reply=await callClaude("You are an expert UK career coach and Salesforce/CRM specialist. Help with resumes, cover letters, job searching in the UK, salary negotiation, and interview prep. Be concise and practical. Focus on the UK job market.",input.trim(),apiKey);
      setMsgs(m=>[...m,{role:"assistant",content:reply}]);
    }catch(e){setMsgs(m=>[...m,{role:"assistant",content:"Sorry, I ran into an error: "+e.message}]);}
    setLoading(false);
  }

  const suggestions=["Write a cover letter for an SFMC Consultant role","What salary should I ask for as an SFMC specialist in London?","How do I explain a gap in employment?","What are the top SFMC certifications for 2025?","How do I get a job without UK experience?"];

  return(
    <div style={{animation:"fadeUp 0.3s ease",display:"flex",flexDirection:"column",height:"calc(100vh - 120px)"}}>
      <div style={{marginBottom:"20px"}}>
        <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"28px",fontWeight:800,letterSpacing:"-0.03em",margin:"0 0 4px"}}>AI Career Assistant</h2>
        <p style={{color:"var(--muted)",fontSize:"14px"}}>Ask anything about your career, CV, interviews, or the UK job market.</p>
      </div>
      <div style={{flex:1,background:"#fff",borderRadius:"14px",border:"1.5px solid var(--border)",padding:"20px",overflowY:"auto",marginBottom:"12px",boxShadow:"var(--shadow)"}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:"12px",animation:"fadeUp 0.2s ease"}}>
            <div style={{maxWidth:"78%",padding:"12px 16px",borderRadius:m.role==="user"?"14px 14px 4px 14px":"14px 14px 14px 4px",background:m.role==="user"?"var(--accent)":"var(--bg)",color:m.role==="user"?"#fff":"var(--text)",fontSize:"14px",lineHeight:1.6,whiteSpace:"pre-wrap"}}>
              {m.content}
            </div>
          </div>
        ))}
        {loading&&<div style={{display:"flex",justifyContent:"flex-start",marginBottom:"12px"}}><div style={{padding:"12px 16px",borderRadius:"14px 14px 14px 4px",background:"var(--bg)",color:"var(--muted)",fontSize:"14px",animation:"pulse 1.5s infinite"}}>Thinking...</div></div>}
        <div ref={endRef}/>
      </div>
      {msgs.length<3&&(
        <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"10px"}}>
          {suggestions.map(s=>(
            <button key={s} onClick={()=>{setInput(s);}} style={{padding:"6px 12px",borderRadius:"8px",border:"1.5px solid var(--border)",background:"#fff",fontSize:"12px",cursor:"pointer",color:"var(--muted)",fontWeight:500}}>{s}</button>
          ))}
        </div>
      )}
      <div style={{display:"flex",gap:"10px"}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="Ask anything about your career..." style={{...inp,flex:1,fontSize:"14px",padding:"12px 16px"}}/>
        <button onClick={send} disabled={loading||!input.trim()} style={{...btnPrimary,padding:"12px 24px",opacity:loading||!input.trim()?0.6:1}}>Send</button>
      </div>
    </div>
  );
}

/* ─── APPLICATION TRACKER VIEW ─────────────────────────────────────── */
function TrackerView({jobs,setJobs}){
  const [filter,setFilter]=useState("all");
  const [showAdd,setShowAdd]=useState(false);
  const [viewJob,setViewJob]=useState(null);
  const [form,setForm]=useState({title:"",company:"",source:"LinkedIn",url:"",resumeVersion:"",notes:""});
  const counts=Object.fromEntries(Object.keys(STATUS).map(k=>[k,jobs.filter(j=>j.status===k).length]));
  const filtered=filter==="all"?jobs:jobs.filter(j=>j.status===filter);

  function addJob(){
    if(!form.title.trim()||!form.company.trim()) return;
    const j={id:uid(),...form,status:"applied",appliedDate:today(),analysis:null};
    const u=[j,...jobs];setJobs(u);S.set("rr_jobs",u);
    setShowAdd(false);setForm({title:"",company:"",source:"LinkedIn",url:"",resumeVersion:"",notes:""});
  }
  function upStatus(id,s){const u=jobs.map(j=>j.id===id?{...j,status:s}:j);setJobs(u);S.set("rr_jobs",u);}
  function del(id){const u=jobs.filter(j=>j.id!==id);setJobs(u);S.set("rr_jobs",u);if(viewJob?.id===id)setViewJob(null);}

  return(
    <div style={{animation:"fadeUp 0.3s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"24px",flexWrap:"wrap",gap:"12px"}}>
        <div>
          <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"28px",fontWeight:800,letterSpacing:"-0.03em",margin:"0 0 4px"}}>Application Tracker</h2>
          <p style={{color:"var(--muted)",fontSize:"14px"}}>Track every application with the exact resume version you sent.</p>
        </div>
        <button onClick={()=>setShowAdd(true)} style={btnPrimary}>+ Add Application</button>
      </div>

      {/* Pipeline */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:"8px",marginBottom:"20px"}}>
        {Object.entries(STATUS).map(([k,v])=>(
          <div key={k} onClick={()=>setFilter(k)} style={{background:v.bg,border:`1.5px solid ${v.c}33`,borderRadius:"10px",padding:"12px 8px",textAlign:"center",cursor:"pointer",transition:"transform 0.1s"}}>
            <div style={{fontSize:"24px",fontWeight:800,color:v.c,fontFamily:"'Syne',sans-serif"}}>{counts[k]||0}</div>
            <div style={{fontSize:"10px",fontWeight:700,color:v.c,marginTop:"2px",textTransform:"uppercase",letterSpacing:"0.04em"}}>{v.label}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"16px"}}>
        {[["all","All",jobs.length],...Object.entries(STATUS).map(([k,v])=>[k,v.label,counts[k]])].map(([k,label,count])=>(
          <button key={k} onClick={()=>setFilter(k)} style={{padding:"5px 14px",borderRadius:"999px",fontSize:"12px",fontWeight:600,cursor:"pointer",border:filter===k?"2px solid var(--text)":"1.5px solid var(--border)",background:filter===k?"var(--text)":"#fff",color:filter===k?"#fff":"var(--muted)"}}>
            {label}{Number(count)>0&&<span style={{opacity:0.6}}> ({count})</span>}
          </button>
        ))}
      </div>

      {filtered.length===0&&(
        <div style={{textAlign:"center",padding:"72px 0",color:"var(--muted)"}}>
          <div style={{fontSize:"48px",marginBottom:"14px"}}>📋</div>
          <p style={{fontFamily:"'Syne',sans-serif",fontSize:"18px",fontWeight:700,marginBottom:"6px"}}>No applications yet</p>
          <p style={{fontSize:"13px"}}>Add jobs manually or track them from the job board.</p>
        </div>
      )}

      <div style={{display:"flex",flexDirection:"column",gap:"8px"}}>
        {filtered.map(job=>(
          <div key={job.id} style={{background:"#fff",border:"1.5px solid var(--border)",borderRadius:"12px",padding:"16px 20px",display:"flex",alignItems:"center",gap:"12px",flexWrap:"wrap",boxShadow:"var(--shadow)"}}>
            <div style={{flex:1,minWidth:"180px"}}>
              <div style={{fontWeight:700,fontSize:"15px",fontFamily:"'Syne',sans-serif"}}>{job.title}</div>
              <div style={{color:"var(--muted)",fontSize:"12px",marginTop:"3px"}}>{job.company} · {job.source} · {job.appliedDate}</div>
              {job.resumeVersion&&<div style={{fontSize:"11px",color:"var(--accent)",marginTop:"3px",fontWeight:600}}>📄 {job.resumeVersion}</div>}
              {job.notes&&<div style={{fontSize:"11px",color:"var(--muted)",marginTop:"2px",fontStyle:"italic"}}>{job.notes}</div>}
            </div>
            {job.analysis&&<div style={{fontFamily:"'Syne',sans-serif",fontSize:"18px",fontWeight:800,color:job.analysis.score>=75?"var(--accent)":job.analysis.score>=50?"var(--amber)":"var(--red)"}}>{job.analysis.score}%</div>}
            <StatusDrop status={job.status} onChange={s=>upStatus(job.id,s)}/>
            {job.url&&<a href={job.url} target="_blank" rel="noreferrer" style={{fontSize:"12px",color:"var(--blue)",fontWeight:600}}>View ↗</a>}
            {job.analysis&&<button onClick={()=>setViewJob(job)} style={{...btnGhost,padding:"6px 12px",fontSize:"12px"}}>Analysis</button>}
            <button onClick={()=>del(job.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#d1d5db",fontSize:"16px",padding:"4px"}}>×</button>
          </div>
        ))}
      </div>

      <Modal open={showAdd} onClose={()=>setShowAdd(false)}>
        <h3 style={{fontFamily:"'Syne',sans-serif",fontSize:"22px",fontWeight:800,margin:"0 0 20px",letterSpacing:"-0.02em"}}>Add Application</h3>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"12px",marginBottom:"12px"}}>
          <div><label style={lbl}>Job Title *</label><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="e.g. SFMC Consultant" style={inp}/></div>
          <div><label style={lbl}>Company *</label><input value={form.company} onChange={e=>setForm(f=>({...f,company:e.target.value}))} placeholder="e.g. Accenture" style={inp}/></div>
        </div>
        <div style={{marginBottom:"12px"}}>
          <label style={lbl}>Source</label>
          <select value={form.source} onChange={e=>setForm(f=>({...f,source:e.target.value}))} style={inp}>
            {SOURCES.map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <div style={{marginBottom:"12px"}}><label style={lbl}>Job URL</label><input type="url" value={form.url} onChange={e=>setForm(f=>({...f,url:e.target.value}))} placeholder="https://linkedin.com/jobs/..." style={inp}/></div>
        <div style={{marginBottom:"12px"}}><label style={lbl}>Resume Version Used</label><input value={form.resumeVersion} onChange={e=>setForm(f=>({...f,resumeVersion:e.target.value}))} placeholder="e.g. Resume v3 - SFMC Focus" style={inp}/></div>
        <div style={{marginBottom:"20px"}}><label style={lbl}>Notes</label><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="e.g. Referred by contact, salary £70k" style={{...txta,height:"72px"}}/></div>
        <div style={{display:"flex",gap:"10px"}}>
          <button onClick={addJob} style={btnPrimary}>Save Application</button>
          <button onClick={()=>setShowAdd(false)} style={btnGhost}>Cancel</button>
        </div>
      </Modal>

      <Modal open={!!viewJob} onClose={()=>setViewJob(null)}>
        {viewJob?.analysis&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px",flexWrap:"wrap",gap:"12px"}}>
              <div>
                <h3 style={{fontFamily:"'Syne',sans-serif",fontSize:"22px",fontWeight:800,margin:"0 0 3px",letterSpacing:"-0.02em"}}>{viewJob.title}</h3>
                <p style={{color:"var(--muted)",fontSize:"13px"}}>{viewJob.company}</p>
                {viewJob.resumeVersion&&<p style={{fontSize:"12px",color:"var(--accent)",fontWeight:600,marginTop:"2px"}}>📄 {viewJob.resumeVersion}</p>}
              </div>
              <ScoreRing score={viewJob.analysis.score}/>
            </div>
            <p style={{color:"var(--muted)",lineHeight:1.7,marginBottom:"20px",fontSize:"14px"}}>{viewJob.analysis.summary}</p>
            <div style={{marginBottom:"14px"}}>
              <p style={lbl}>Missing Keywords</p>
              <div>{viewJob.analysis.missingKeywords?.map(k=><Pill key={k} label={k} v="red"/>)}</div>
            </div>
            <div>
              <p style={lbl}>Suggested Fixes</p>
              {viewJob.analysis.alterations?.map((a,i)=>(
                <div key={i} style={{padding:"12px",background:"var(--bg)",borderRadius:"8px",marginBottom:"8px"}}>
                  <Pill label={a.section} v="amber"/>
                  <p style={{margin:"6px 0 3px",fontSize:"12px",color:"var(--muted)"}}><b>Issue:</b> {a.issue}</p>
                  <p style={{margin:0,fontSize:"13px"}}><b>Fix:</b> {a.suggestion}</p>
                </div>
              ))}
            </div>
          </>
        )}
      </Modal>
    </div>
  );
}

        {/* Logo */}
        <div style={{padding:"24px 20px 20px",borderBottom:"1px solid rgba(255,255,255,0.06)"}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:"20px",fontWeight:800,letterSpacing:"-0.03em",marginBottom:"2px"}}>
            Role<span style={{color:"var(--accent)"}}>Ready</span>
          </div>
          <div style={{fontSize:"11px",color:"var(--sidebar-muted)",fontWeight:500,letterSpacing:"0.06em"}}>UK JOB PLATFORM</div>
        </div>

        {/* Nav */}
        <nav style={{flex:1,padding:"12px 10px",overflowY:"auto"}}>
          <div style={{fontSize:"10px",color:"var(--sidebar-muted)",fontWeight:700,letterSpacing:"0.1em",padding:"8px 10px 6px",textTransform:"uppercase"}}>Navigation</div>
          {SIDEBAR_NAV.map(n=>(
            <button key={n.id} id={n.id==="scanner"?"resumeTab":undefined} onClick={()=>setTab(n.id)} style={{display:"flex",alignItems:"center",gap:"10px",width:"100%",padding:"10px 12px",borderRadius:"9px",border:"none",cursor:"pointer",fontSize:"13px",fontWeight:tab===n.id?700:500,background:tab===n.id?"rgba(29,107,62,0.25)":"transparent",color:tab===n.id?"#fff":"var(--sidebar-muted)",marginBottom:"2px",textAlign:"left",transition:"all 0.15s",fontFamily:"'Instrument Sans',sans-serif"}}>
              <span style={{fontSize:"15px",opacity:tab===n.id?1:0.7}}>{n.icon}</span>
              {n.label}
              {n.id==="tracker"&&jobs.length>0&&<span style={{marginLeft:"auto",background:"var(--accent)",color:"#fff",borderRadius:"999px",fontSize:"10px",fontWeight:700,padding:"1px 7px"}}>{jobs.length}</span>}
            </button>
          ))}
        </nav>

        {/* Bottom */}
        <div style={{padding:"14px 14px 20px",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
          <button onClick={()=>{S.set("rr_apikey","");setApiKey("");}} style={{display:"flex",alignItems:"center",gap:"8px",width:"100%",padding:"9px 12px",borderRadius:"8px",border:"none",cursor:"pointer",fontSize:"12px",background:"rgba(255,255,255,0.06)",color:"var(--sidebar-muted)",fontFamily:"'Instrument Sans',sans-serif",fontWeight:500}}>
            🔑 API Key Settings
          </button>
        </div>
      </aside>

      {/* Main content */}
      <main style={{marginLeft:"220px",flex:1,padding:"28px 32px",minHeight:"100vh"}}>
        {/* Top bar */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"24px"}}>
          <div>
            <h1 style={{fontFamily:"'Syne',sans-serif",fontSize:"16px",fontWeight:700,color:"var(--muted)",letterSpacing:"0.01em"}}>
              {SIDEBAR_NAV.find(n=>n.id===tab)?.icon} {SIDEBAR_NAV.find(n=>n.id===tab)?.label}
            </h1>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
            <span style={{fontSize:"12px",color:"var(--muted)"}}>{jobs.length} tracked</span>
            <div style={{width:"32px",height:"32px",borderRadius:"50%",background:"var(--accent)",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:"13px",fontFamily:"'Syne',sans-serif"}}>V</div>
          </div>
        </div>

        {/* Page content */}
        {tab==="jobs"&&<JobBoardView apiKey={apiKey} onTrackJob={saveJob}/>}
        {tab==="scanner"&&<ResumeView apiKey={apiKey}/>}
        {tab==="ninja"&&<AINinjaView apiKey={apiKey}/>}
        {tab==="tracker"&&<TrackerView jobs={jobs} setJobs={setJobs}/>}
        {tab==="resumes"&&<MyResumesView/>}
        {tab==="pricing"&&<PricingView/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

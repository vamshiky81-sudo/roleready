<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoleReady - AI Resume Analyser</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:#f8f8f6;font-family:'DM Sans',sans-serif;color:#111;-webkit-font-smoothing:antialiased;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    input,textarea,select{font-family:inherit;}
    input:focus,textarea:focus,select:focus{outline:none;border-color:#111!important;box-shadow:0 0 0 3px rgba(17,17,17,0.1);}
    ::-webkit-scrollbar{width:6px;}
    ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const S = {
  get:(k)=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};

const uid = () => Math.random().toString(36).slice(2,10);
const todayStr = () => new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});

const STATUS = {
  saved:     {label:"Saved",     c:"#6b7280",bg:"#f3f4f6"},
  applied:   {label:"Applied",   c:"#2563eb",bg:"#eff6ff"},
  screening: {label:"Screening", c:"#7c3aed",bg:"#f5f3ff"},
  interview: {label:"Interview", c:"#d97706",bg:"#fffbeb"},
  offer:     {label:"Offer",     c:"#059669",bg:"#ecfdf5"},
  rejected:  {label:"Rejected",  c:"#dc2626",bg:"#fef2f2"},
};

const inp = {width:"100%",padding:"11px 14px",borderRadius:"10px",border:"1.5px solid #d1d5db",fontSize:"14px",background:"#fafafa"};
const txta = {...inp,resize:"vertical",lineHeight:1.6};
const lbl = {display:"block",fontSize:"13px",fontWeight:600,marginBottom:"6px",color:"#374151"};
const btnP = {background:"#111",color:"#fff",border:"none",borderRadius:"12px",padding:"13px 28px",fontSize:"15px",fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"};
const btnG = {background:"#fff",color:"#111",border:"1.5px solid #e5e7eb",borderRadius:"12px",padding:"11px 22px",fontSize:"14px",fontWeight:600,cursor:"pointer",fontFamily:"'DM Sans',sans-serif"};

async function callClaude(system, user, apiKey) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,system:system,messages:[{role:"user",content:user}]})
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e?.error?.message||"HTTP "+res.status);}
  const d=await res.json();
  return d.content?.map(b=>b.text||"").join("")||"";
}

async function runAnalysis(resume, jd, apiKey) {
  const sys=`You are an expert ATS analyst and career coach. Analyse the resume against the job description. Return ONLY valid JSON, no markdown, no backticks. Schema: {"score":<0-100>,"summary":"<2 sentences>","missingKeywords":["kw1","kw2"],"presentKeywords":["kw1","kw2"],"topSkillsRequired":["s1","s2","s3","s4","s5"],"alterations":[{"section":"name","issue":"what is wrong","suggestion":"exact fix"}],"strengths":["s1","s2","s3"],"quickWins":["w1","w2","w3"]}`;
  const raw=await callClaude(sys,"RESUME:\n"+resume+"\n\nJOB DESCRIPTION:\n"+jd,apiKey);
  try{return JSON.parse(raw.replace(/```json|```/g,"").trim());}catch{return null;}
}

function ScoreRing({score}){
  const r=54,c=2*Math.PI*r,dash=c*(score/100);
  const col=score>=75?"#10b981":score>=50?"#f59e0b":"#ef4444";
  return(
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r={r} fill="none" stroke="#e5e7eb" strokeWidth="12"/>
      <circle cx="70" cy="70" r={r} fill="none" stroke={col} strokeWidth="12" strokeDasharray={`${dash} ${c}`} strokeLinecap="round" transform="rotate(-90 70 70)" style={{transition:"stroke-dasharray 1.2s ease"}}/>
      <text x="70" y="66" textAnchor="middle" fontSize="28" fontWeight="700" fill={col} fontFamily="DM Serif Display,serif">{score}</text>
      <text x="70" y="84" textAnchor="middle" fontSize="11" fill="#6b7280" fontFamily="DM Sans,sans-serif">ATS Score</text>
    </svg>
  );
}

function Pill({label,v="def"}){
  const vs={green:{bg:"#dcfce7",c:"#166534"},red:{bg:"#fee2e2",c:"#991b1b"},blue:{bg:"#dbeafe",c:"#1e40af"},amber:{bg:"#fef3c7",c:"#92400e"},def:{bg:"#f3f4f6",c:"#374151"}};
  const s=vs[v]||vs.def;
  return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:"999px",fontSize:"12px",fontWeight:600,background:s.bg,color:s.c,margin:"3px"}}>{label}</span>;
}

function Modal({open,onClose,children}){
  if(!open) return null;
  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(10,10,20,0.65)",backdropFilter:"blur(5px)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{background:"#fff",borderRadius:"20px",maxWidth:"740px",width:"100%",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 40px 100px rgba(0,0,0,0.25)",padding:"36px",animation:"fadeUp 0.25s ease"}}>
        {children}
      </div>
    </div>
  );
}

function StatusDrop({status,onChange}){
  const [open,setOpen]=useState(false);
  const m=STATUS[status]||STATUS.saved;
  return(
    <div style={{position:"relative"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{background:m.bg,color:m.c,border:`1.5px solid ${m.c}`,borderRadius:"8px",padding:"5px 12px",fontSize:"12px",fontWeight:700,cursor:"pointer"}}>{m.label} v</button>
      {open&&(
        <div style={{position:"absolute",top:"38px",left:0,zIndex:50,background:"#fff",borderRadius:"12px",boxShadow:"0 8px 40px rgba(0,0,0,0.16)",overflow:"hidden",minWidth:"150px"}}>
          {Object.entries(STATUS).map(([k,v])=>(
            <button key={k} onClick={()=>{onChange(k);setOpen(false);}} style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",fontSize:"13px",fontWeight:600,background:status===k?v.bg:"transparent",color:v.c,border:"none",cursor:"pointer"}}>{v.label}</button>
          ))}
        </div>
      )}
    </div>
  );
}

function Sec({title,children}){
  return(
    <div style={{marginBottom:"24px"}}>
      <h4 style={{fontFamily:"'DM Serif Display',serif",fontSize:"16px",color:"#111",margin:"0 0 12px"}}>{title}</h4>
      {children}
    </div>
  );
}

function Row({children}){
  return <div style={{display:"flex",alignItems:"flex-start",padding:"12px 16px",background:"#fafafa",borderRadius:"10px",marginBottom:"8px",fontSize:"14px",color:"#374151",lineHeight:1.5}}>{children}</div>;
}

// ---- API KEY SETUP SCREEN ----
function ApiKeySetup({onSave}){
  const [key,setKey]=useState("");
  const [err,setErr]=useState("");
  const [testing,setTesting]=useState(false);

  async function go(){
    if(!key.trim()){setErr("Please enter your API key.");return;}
    if(!key.startsWith("sk-ant-")){setErr("Anthropic API keys start with sk-ant- — please check and try again.");return;}
    setErr("");setTesting(true);
    try{
      await callClaude("Reply with only the word OK","ping",key);
      S.set("rr_apikey",key);
      onSave(key);
    }catch(e){
      setErr("Key test failed: "+e.message+". Please double-check your key and try again.");
    }
    setTesting(false);
  }

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e3a5f)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{background:"#fff",borderRadius:"24px",maxWidth:"520px",width:"100%",padding:"48px",boxShadow:"0 40px 100px rgba(0,0,0,0.4)",animation:"fadeUp 0.4s ease"}}>
        <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"30px",marginBottom:"4px"}}>Role<span style={{color:"#2563eb"}}>Ready</span></div>
        <p style={{color:"#6b7280",fontSize:"14px",marginBottom:"32px"}}>AI-powered resume analyser and job tracker</p>
        <h2 style={{fontFamily:"'DM Serif Display',serif",fontSize:"20px",margin:"0 0 8px",color:"#111"}}>Enter your API Key to get started</h2>
        <p style={{color:"#6b7280",fontSize:"14px",lineHeight:1.6,marginBottom:"24px"}}>RoleReady uses Claude AI to analyse your resume. You need a free Anthropic API key. It is saved only in your browser.</p>
        <div style={{background:"#eff6ff",border:"1.5px solid #bfdbfe",borderRadius:"12px",padding:"18px",marginBottom:"24px"}}>
          <p style={{margin:"0 0 10px",fontWeight:700,color:"#1e40af",fontSize:"14px"}}>How to get your free API key:</p>
          <ol style={{margin:0,paddingLeft:"20px",color:"#1e40af",fontSize:"13px",lineHeight:2.2}}>
            <li>Go to <strong>console.anthropic.com</strong></li>
            <li>Sign up free</li>
            <li>Click <strong>API Keys</strong> in the left menu</li>
            <li>Click <strong>Create Key</strong> and copy it</li>
            <li>Paste below</li>
          </ol>
          <p style={{margin:"10px 0 0",fontSize:"12px",color:"#3730a3"}}>Free tier = $5 credit = hundreds of analyses</p>
        </div>
        <div style={{marginBottom:"16px"}}>
          <label style={lbl}>Your Anthropic API Key</label>
          <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api03-..." style={{...inp,fontFamily:"'JetBrains Mono',monospace",fontSize:"13px"}} onKeyDown={e=>e.key==="Enter"&&go()}/>
        </div>
        {err&&<div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:"8px",padding:"12px",marginBottom:"16px",fontSize:"13px",color:"#dc2626"}}>{err}</div>}
        <button onClick={go} disabled={testing||!key.trim()} style={{...btnP,width:"100%",opacity:testing||!key.trim()?0.6:1,padding:"15px"}}>{testing?"Testing key...":"Save Key and Start"}</button>
        <p style={{color:"#9ca3af",fontSize:"12px",textAlign:"center",marginTop:"16px",lineHeight:1.6}}>Your key stays in your browser only. You can change it anytime.</p>
      </div>
    </div>
  );
}

// ---- ANALYSER VIEW ----
function AnalyserView({onSave,apiKey}){
  const [resume,setResume]=useState("");
  const [jd,setJd]=useState("");
  const [title,setTitle]=useState("");
  const [company,setCompany]=useState("");
  const [loading,setLoading]=useState(false);
  const [res,setRes]=useState(null);
  const [err,setErr]=useState("");
  const [saved,setSaved]=useState(false);

  async function analyse(){
    if(!resume.trim()||!jd.trim()){setErr("Please paste both your resume and the job description.");return;}
    setErr("");setLoading(true);setRes(null);setSaved(false);
    try{
      const r=await runAnalysis(resume,jd,apiKey);
      setLoading(false);
      if(!r){setErr("Analysis failed - please try again.");return;}
      setRes(r);
    }catch(e){
      setLoading(false);
      setErr("Error: "+e.message+" - Click the API Key button in the top bar to update your key.");
    }
  }

  function save(){
    onSave({id:uid(),title:title||"Untitled Role",company:company||"Unknown",status:"saved",appliedDate:todayStr(),source:"manual",jd,resume,analysis:res,resumeVersion:"Resume - "+todayStr()});
    setSaved(true);
  }

  return(
    <div style={{animation:"fadeUp 0.4s ease"}}>
      <div style={{marginBottom:"32px"}}>
        <h2 style={{fontFamily:"'DM Serif Display',serif",fontSize:"32px",color:"#111",margin:"0 0 8px"}}>Resume Analyser</h2>
        <p style={{color:"#6b7280",fontSize:"15px"}}>Paste your resume and a job description to get your ATS score, missing keywords, and exact edits.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginBottom:"14px"}}>
        <div><label style={lbl}>Job Title</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. SFMC Consultant" style={inp}/></div>
        <div><label style={lbl}>Company</label><input value={company} onChange={e=>setCompany(e.target.value)} placeholder="e.g. Deloitte" style={inp}/></div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px",marginBottom:"20px"}}>
        <div><label style={lbl}>Your Resume</label><textarea value={resume} onChange={e=>setResume(e.target.value)} placeholder="Paste your full resume text here..." style={{...txta,height:"280px"}}/></div>
        <div><label style={lbl}>Job Description</label><textarea value={jd} onChange={e=>setJd(e.target.value)} placeholder="Paste the complete job description here..." style={{...txta,height:"280px"}}/></div>
      </div>
      {err&&<div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:"10px",padding:"14px",marginBottom:"16px",fontSize:"14px",color:"#dc2626"}}>{err}</div>}
      <button onClick={analyse} disabled={loading} style={{...btnP,opacity:loading?0.7:1}}>{loading?"Analysing...":"Analyse My Resume"}</button>
      {loading&&(
        <div style={{textAlign:"center",padding:"60px 0",color:"#6b7280"}}>
          <div style={{fontSize:"40px",display:"inline-block",animation:"spin 1.2s linear infinite"}}>&#9881;</div>
          <p style={{marginTop:"16px",fontWeight:600,fontSize:"15px"}}>Running ATS analysis...</p>
          <p style={{fontSize:"13px",color:"#9ca3af",marginTop:"6px"}}>Checking keywords, skills, and formatting. Usually takes 10-20 seconds.</p>
        </div>
      )}
      {res&&(
        <div style={{marginTop:"40px",animation:"fadeUp 0.4s ease"}}>
          <div style={{display:"flex",alignItems:"center",gap:"40px",flexWrap:"wrap",background:"#fafafa",border:"1.5px solid #e5e7eb",borderRadius:"20px",padding:"32px",marginBottom:"24px"}}>
            <ScoreRing score={res.score}/>
            <div style={{flex:1,minWidth:"240px"}}>
              <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:"22px",margin:"0 0 10px"}}>{res.score>=75?"Strong match - you are competitive":res.score>=50?"Decent match - targeted edits will help":"Needs work - significant gaps to address"}</h3>
              <p style={{color:"#374151",margin:0,lineHeight:1.7}}>{res.summary}</p>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px",marginBottom:"20px"}}>
            <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px"}}>
              <Sec title="Keywords Present"><div>{res.presentKeywords?.slice(0,12).map(k=><Pill key={k} label={k} v="green"/>)}</div></Sec>
            </div>
            <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px"}}>
              <Sec title="Missing Keywords - Add These"><div>{res.missingKeywords?.map(k=><Pill key={k} label={k} v="red"/>)}</div></Sec>
            </div>
          </div>
          <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px",marginBottom:"20px"}}>
            <Sec title="Top Skills This Role Requires"><div>{res.topSkillsRequired?.map(s=><Pill key={s} label={s} v="blue"/>)}</div></Sec>
          </div>
          <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px",marginBottom:"20px"}}>
            <Sec title="Your Strengths">
              {res.strengths?.map((s,i)=><Row key={i}><span style={{color:"#10b981",marginRight:"12px",fontWeight:700,flexShrink:0}}>&#10003;</span>{s}</Row>)}
            </Sec>
          </div>
          <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px",marginBottom:"20px"}}>
            <Sec title="Quick Wins - Do These First">
              {res.quickWins?.map((w,i)=><Row key={i}><span style={{background:"#eff6ff",color:"#2563eb",borderRadius:"50%",width:"24px",height:"24px",display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:"12px",marginRight:"12px",flexShrink:0}}>{i+1}</span>{w}</Row>)}
            </Sec>
          </div>
          <div style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"20px",marginBottom:"24px"}}>
            <Sec title="Suggested Alterations">
              {res.alterations?.map((a,i)=>(
                <div key={i} style={{padding:"14px 16px",background:"#fafafa",borderRadius:"10px",marginBottom:"10px"}}>
                  <div style={{marginBottom:"6px"}}><Pill label={a.section} v="amber"/></div>
                  <p style={{margin:"0 0 4px",color:"#6b7280",fontSize:"13px"}}><b>Issue:</b> {a.issue}</p>
                  <p style={{margin:0,color:"#111",fontSize:"13px"}}><b>Fix:</b> {a.suggestion}</p>
                </div>
              ))}
            </Sec>
          </div>
          <div style={{padding:"24px 28px",background:"#eff6ff",borderRadius:"16px",border:"1.5px solid #bfdbfe"}}>
            <h4 style={{margin:"0 0 6px",color:"#1e40af",fontFamily:"'DM Serif Display',serif",fontSize:"18px"}}>Save to Job Tracker?</h4>
            <p style={{margin:"0 0 16px",color:"#3730a3",fontSize:"14px"}}>Keep this analysis and track which resume you sent.</p>
            {saved?<span style={{color:"#059669",fontWeight:700,fontSize:"15px"}}>Saved to your Application Tracker!</span>:<button onClick={save} style={{...btnP,background:"#2563eb"}}>Save to Tracker</button>}
          </div>
        </div>
      )}
    </div>
  );
}

// ---- TRACKER VIEW ----
function TrackerView({jobs,setJobs}){
  const [filter,setFilter]=useState("all");
  const [showAdd,setShowAdd]=useState(false);
  const [viewJob,setViewJob]=useState(null);
  const [form,setForm]=useState({title:"",company:"",source:"LinkedIn",url:"",resumeVersion:"",notes:""});
  const counts=Object.fromEntries(Object.keys(STATUS).map(k=>[k,jobs.filter(j=>j.status===k).length]));
  const filtered=filter==="all"?jobs:jobs.filter(j=>j.status===filter);
  function addJob(){
    if(!form.title.trim()||!form.company.trim()) return;
    const j={id:uid(),...form,status:"applied",appliedDate:todayStr(),analysis:null};
    const u=[j,...jobs];setJobs(u);S.set("rr_jobs",u);
    setShowAdd(false);setForm({title:"",company:"",source:"LinkedIn",url:"",resumeVersion:"",notes:""});
  }
  function upStatus(id,s){const u=jobs.map(j=>j.id===id?{...j,status:s}:j);setJobs(u);S.set("rr_jobs",u);}
  function del(id){const u=jobs.filter(j=>j.id!==id);setJobs(u);S.set("rr_jobs",u);if(viewJob?.id===id)setViewJob(null);}
  return(
    <div style={{animation:"fadeUp 0.4s ease"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"28px",flexWrap:"wrap",gap:"12px"}}>
        <div>
          <h2 style={{fontFamily:"'DM Serif Display',serif",fontSize:"32px",color:"#111",margin:"0 0 6px"}}>Application Tracker</h2>
          <p style={{color:"#6b7280",fontSize:"15px"}}>Track every application with the resume version you sent.</p>
        </div>
        <button onClick={()=>setShowAdd(true)} style={btnP}>+ Add Application</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:"10px",marginBottom:"24px"}}>
        {Object.entries(STATUS).map(([k,v])=>(
          <div key={k} onClick={()=>setFilter(k)} style={{background:v.bg,border:`1.5px solid ${v.c}33`,borderRadius:"12px",padding:"14px 10px",textAlign:"center",cursor:"pointer"}}>
            <div style={{fontSize:"26px",fontWeight:800,color:v.c,fontFamily:"'DM Serif Display',serif"}}>{counts[k]||0}</div>
            <div style={{fontSize:"11px",fontWeight:700,color:v.c,marginTop:"2px"}}>{v.label}</div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"20px"}}>
        {[["all","All",jobs.length],...Object.entries(STATUS).map(([k,v])=>[k,v.label,counts[k]])].map(([k,label,count])=>(
          <button key={k} onClick={()=>setFilter(k)} style={{padding:"6px 16px",borderRadius:"999px",fontSize:"13px",fontWeight:600,cursor:"pointer",border:filter===k?"2px solid #111":"2px solid #e5e7eb",background:filter===k?"#111":"#fff",color:filter===k?"#fff":"#374151"}}>
            {label}{count>0&&<span style={{opacity:0.6}}> ({count})</span>}
          </button>
        ))}
      </div>
      {filtered.length===0&&(
        <div style={{textAlign:"center",padding:"80px 0",color:"#9ca3af"}}>
          <div style={{fontSize:"56px",marginBottom:"16px"}}>📋</div>
          <p style={{fontWeight:600,fontSize:"16px"}}>No applications yet</p>
          <p style={{fontSize:"14px",marginTop:"8px"}}>Analyse a job and save it, or add one manually above.</p>
        </div>
      )}
      <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
        {filtered.map(job=>(
          <div key={job.id} style={{background:"#fff",border:"1.5px solid #e5e7eb",borderRadius:"16px",padding:"18px 22px",display:"flex",alignItems:"center",gap:"14px",flexWrap:"wrap",boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
            <div style={{flex:1,minWidth:"180px"}}>
              <div style={{fontWeight:700,fontSize:"16px",color:"#111"}}>{job.title}</div>
              <div style={{color:"#6b7280",fontSize:"13px",marginTop:"3px"}}>{job.company} · {job.source} · {job.appliedDate}</div>
              {job.resumeVersion&&<div style={{fontSize:"12px",color:"#7c3aed",marginTop:"4px",fontWeight:600}}>Resume: {job.resumeVersion}</div>}
              {job.notes&&<div style={{fontSize:"12px",color:"#6b7280",marginTop:"3px",fontStyle:"italic"}}>{job.notes}</div>}
            </div>
            {job.analysis&&<div style={{fontFamily:"'DM Serif Display',serif",fontSize:"20px",fontWeight:700,color:job.analysis.score>=75?"#10b981":job.analysis.score>=50?"#f59e0b":"#ef4444"}}>{job.analysis.score}%</div>}
            <StatusDrop status={job.status} onChange={s=>upStatus(job.id,s)}/>
            {job.url&&<a href={job.url} target="_blank" rel="noreferrer" style={{fontSize:"12px",color:"#2563eb",textDecoration:"none",fontWeight:600}}>View listing</a>}
            {job.analysis&&<button onClick={()=>setViewJob(job)} style={{...btnG,padding:"7px 14px",fontSize:"13px"}}>View Analysis</button>}
            <button onClick={()=>del(job.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#d1d5db",fontSize:"18px",padding:"4px"}}>x</button>
          </div>
        ))}
      </div>
      <Modal open={showAdd} onClose={()=>setShowAdd(false)}>
        <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:"26px",margin:"0 0 24px"}}>Add Application</h3>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px",marginBottom:"14px"}}>
          <div><label style={lbl}>Job Title *</label><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="e.g. SFMC Consultant" style={inp}/></div>
          <div><label style={lbl}>Company *</label><input value={form.company} onChange={e=>setForm(f=>({...f,company:e.target.value}))} placeholder="e.g. Accenture" style={inp}/></div>
        </div>
        <div style={{marginBottom:"14px"}}>
          <label style={lbl}>Source</label>
          <select value={form.source} onChange={e=>setForm(f=>({...f,source:e.target.value}))} style={inp}>
            {["LinkedIn","Indeed","Glassdoor","Company Website","Referral","Recruiter","Reed","Total Jobs","Other"].map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        <div style={{marginBottom:"14px"}}><label style={lbl}>Job URL</label><input type="url" value={form.url} onChange={e=>setForm(f=>({...f,url:e.target.value}))} placeholder="https://linkedin.com/jobs/..." style={inp}/></div>
        <div style={{marginBottom:"14px"}}><label style={lbl}>Resume Version Used</label><input value={form.resumeVersion} onChange={e=>setForm(f=>({...f,resumeVersion:e.target.value}))} placeholder="e.g. Resume v3 - SFMC Focus" style={inp}/></div>
        <div style={{marginBottom:"20px"}}><label style={lbl}>Notes</label><textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="e.g. Referred by a contact, salary GBP 70k" style={{...txta,height:"80px"}}/></div>
        <div style={{display:"flex",gap:"12px"}}>
          <button onClick={addJob} style={btnP}>Save Application</button>
          <button onClick={()=>setShowAdd(false)} style={btnG}>Cancel</button>
        </div>
      </Modal>
      <Modal open={!!viewJob} onClose={()=>setViewJob(null)}>
        {viewJob?.analysis&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"24px",flexWrap:"wrap",gap:"16px"}}>
              <div>
                <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:"26px",margin:"0 0 4px"}}>{viewJob.title}</h3>
                <p style={{margin:"0 0 4px",color:"#6b7280"}}>{viewJob.company}</p>
                {viewJob.resumeVersion&&<p style={{margin:0,fontSize:"13px",color:"#7c3aed",fontWeight:600}}>Resume: {viewJob.resumeVersion}</p>}
              </div>
              <ScoreRing score={viewJob.analysis.score}/>
            </div>
            <p style={{color:"#374151",lineHeight:1.7,marginBottom:"24px"}}>{viewJob.analysis.summary}</p>
            <Sec title="Missing Keywords"><div>{viewJob.analysis.missingKeywords?.map(k=><Pill key={k} label={k} v="red"/>)}</div></Sec>
            <Sec title="Quick Wins">
              {viewJob.analysis.quickWins?.map((w,i)=><Row key={i}><span style={{background:"#eff6ff",color:"#2563eb",borderRadius:"50%",width:"22px",height:"22px",display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:"12px",marginRight:"12px",flexShrink:0}}>{i+1}</span>{w}</Row>)}
            </Sec>
            <Sec title="Suggested Alterations">
              {viewJob.analysis.alterations?.map((a,i)=>(
                <div key={i} style={{padding:"14px",background:"#fafafa",borderRadius:"10px",marginBottom:"10px"}}>
                  <Pill label={a.section} v="amber"/>
                  <p style={{margin:"8px 0 4px",fontSize:"13px",color:"#6b7280"}}><b>Issue:</b> {a.issue}</p>
                  <p style={{margin:0,fontSize:"13px",color:"#111"}}><b>Fix:</b> {a.suggestion}</p>
                </div>
              ))}
            </Sec>
          </>
        )}
      </Modal>
    </div>
  );
}

// ---- PRICING VIEW ----
function PricingView(){

    {name:"Free",price:"GBP 0",period:"/forever",highlight:false,tag:null,features:["3 resume analyses per month","Track up to 10 applications","Keyword gap report","ATS score"],cta:"Get Started Free"},
    {name:"Pro",price:"GBP 5",period:"/month",highlight:true,tag:"MOST POPULAR",features:["Unlimited resume analyses","Unlimited application tracking","Detailed alteration suggestions","Resume version history","Export to PDF","Priority support"],cta:"Start Pro - GBP 5/mo"},
    {name:"Coach",price:"GBP 30",period:"/month",highlight:false,tag:null,features:["All Pro features","10 client seats","Client management dashboard","White-label PDF reports","Bulk CSV export","Dedicated support"],cta:"For Career Coaches"},

  return(
    <div style={{animation:"fadeUp 0.4s ease"}}>

            {p.tag&&<div style={{position:"absolute",top:"-14px",left:"50%",transform:"translateX(-50%)",background:"#f59e0b",color:"#111",borderRadius:"999px",padding:"4px 18px",fontSize:"11px",fontWeight:800,letterSpacing:"0.06em",whiteSpace:"nowrap"}}>{p.tag}</div>}
            <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"22px",marginBottom:"8px"}}>{p.name}</div>
            <div style={{fontSize:"40px",fontWeight:800,fontFamily:"'DM Serif Display',serif",lineHeight:1}}>{p.price}<span style={{fontSize:"15px",opacity:0.6,fontFamily:"'DM Sans',sans-serif"}}>{p.period}</span></div>
            <div style={{height:"1px",background:p.highlight?"#333":"#e5e7eb",margin:"24px 0"}}/>
            {p.features.map(f=><div key={f} style={{display:"flex",gap:"10px",marginBottom:"12px",fontSize:"14px",lineHeight:1.5}}><span style={{color:"#10b981",flexShrink:0}}>&#10003;</span>{f}</div>)}
            <button style={{display:"block",width:"100%",marginTop:"28px",padding:"14px",borderRadius:"12px",fontWeight:700,fontSize:"15px",cursor:"pointer",border:"none",background:p.highlight?"#fff":"#111",color:p.highlight?"#111":"#fff",fontFamily:"'DM Sans',sans-serif"}}>{p.cta}</button>
          </div>
        ))}
      </div>
      <div style={{background:"#fafafa",border:"1.5px solid #e5e7eb",borderRadius:"20px",padding:"36px"}}>
        <h3 style={{fontFamily:"'DM Serif Display',serif",fontSize:"24px",margin:"0 0 20px"}}>Revenue Model</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:"14px"}}>
          {[{icon:"💳",t:"Subscriptions",d:"GBP 5/mo Pro, GBP 30/mo Coach. Core recurring revenue."},{icon:"🔗",t:"Job Board Affiliate",d:"3-8% commission on Indeed/LinkedIn referral clicks."},{icon:"✍️",t:"Resume Writing",d:"Upsell professional writers at GBP 49-149 per resume."},{icon:"🏢",t:"Enterprise",d:"Recruitment agencies. GBP 200-500/mo custom plans."}].map(r=>(
            <div key={r.t} style={{background:"#fff",borderRadius:"14px",border:"1.5px solid #e5e7eb",padding:"18px"}}>
              <div style={{fontSize:"28px",marginBottom:"10px"}}>{r.icon}</div>
              <div style={{fontWeight:700,marginBottom:"6px",fontSize:"15px"}}>{r.t}</div>
              <div style={{color:"#6b7280",fontSize:"13px",lineHeight:1.5}}>{r.d}</div>

        <div style={{marginTop:"20px",padding:"18px 20px",background:"#ecfdf5",borderRadius:"12px",border:"1.5px solid #a7f3d0"}}>
          <p style={{margin:0,color:"#065f46",fontSize:"14px",fontWeight:600,lineHeight:1.7}}>Break-even at ~40 Pro users. 500 users = GBP 2,500/mo. 2,000 users = GBP 10,000/mo. Realistic 12-month target with LinkedIn content and SEO: 300-800 paying users.</p>
        </div>
      </div>
    </div>

}

// ---- DEPLOY VIEW ----
function DeployView(){
  const steps=[
    {n:"1",title:"Create GitHub Repository",desc:'Go to github.com and log in. Click the + icon top right then "New repository". Set name to roleready, make it Public, tick "Add a README file", click Create repository.',code:null},
    {n:"2",title:"Upload index.html",desc:'In your repo click "Add file" then "Upload files". Drag in the index.html file you downloaded. Scroll down, write "Add RoleReady app" and click Commit changes.',code:null},
    {n:"3",title:"Enable GitHub Pages",desc:'Click the Settings tab at the top of your repo page. In the left sidebar click Pages. Under Source select "Deploy from a branch". Under Branch select "main" and keep root. Click Save.',code:null},
    {n:"4",title:"Your live URL",desc:"Wait 60-90 seconds, refresh the Pages settings page, and you will see a green banner with your live link. Share it with anyone.",code:"https://YOUR_USERNAME.github.io/roleready/"},
    {n:"5",title:"Phase 2 - Add Payments",desc:"When ready to charge GBP 5/mo: add Supabase for auth and database (free tier), Stripe for payments, deploy to Vercel for serverless functions.",code:"npm install @supabase/supabase-js @stripe/stripe-js"},
  ];
  return(
    <div style={{animation:"fadeUp 0.4s ease"}}>
      <div style={{marginBottom:"32px"}}>
        <h2 style={{fontFamily:"'DM Serif Display',serif",fontSize:"32px",color:"#111",margin:"0 0 8px"}}>Deploy Guide</h2>
        <p style={{color:"#6b7280",fontSize:"15px"}}>From this file to live on GitHub Pages in 5 minutes. No coding needed.</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:"14px"}}>
        {steps.map(s=>(
          <div key={s.n} style={{border:"1.5px solid #e5e7eb",borderRadius:"16px",overflow:"hidden",background:"#fff"}}>
            <div style={{display:"flex",gap:"16px",padding:"20px 24px",alignItems:"flex-start"}}>
              <div style={{width:"34px",height:"34px",borderRadius:"50%",background:"#111",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:"14px",flexShrink:0}}>{s.n}</div>
              <div><h4 style={{margin:"0 0 6px",fontSize:"16px",fontWeight:700}}>{s.title}</h4><p style={{margin:0,color:"#6b7280",fontSize:"14px",lineHeight:1.6}}>{s.desc}</p></div>
            </div>
            {s.code&&<pre style={{margin:0,padding:"16px 24px",background:"#0d1117",color:"#e6edf3",fontFamily:"'JetBrains Mono',monospace",fontSize:"13px",lineHeight:1.7,overflowX:"auto",borderTop:"1px solid #e5e7eb"}}>{s.code}</pre>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ---- APP SHELL ----
const NAV=[{id:"analyse",label:"Analyser"},{id:"tracker",label:"Applications"},{id:"pricing",label:"Pricing"},{id:"deploy",label:"Deploy Guide"}];

function App(){
  const [tab,setTab]=useState("analyse");
  const [jobs,setJobs]=useState(()=>S.get("rr_jobs")||[]);
  const [apiKey,setApiKey]=useState(()=>S.get("rr_apikey")||"");
  function saveJob(j){const u=[j,...jobs];setJobs(u);S.set("rr_jobs",u);}
  if(!apiKey) return <ApiKeySetup onSave={k=>{S.set("rr_apikey",k);setApiKey(k);}}/>;
  return(
    <>
      <header style={{background:"#fff",borderBottom:"1.5px solid #e5e7eb",position:"sticky",top:0,zIndex:40}}>
        <div style={{maxWidth:"1100px",margin:"0 auto",padding:"0 24px",display:"flex",alignItems:"center",height:"62px",gap:"24px"}}>
          <div style={{fontFamily:"'DM Serif Display',serif",fontSize:"22px",letterSpacing:"-0.02em",flexShrink:0}}>Role<span style={{color:"#2563eb"}}>Ready</span></div>
          <nav style={{display:"flex",gap:"4px",flex:1,overflowX:"auto"}}>
            {NAV.map(n=>(
              <button key={n.id} onClick={()=>setTab(n.id)} style={{padding:"7px 16px",borderRadius:"8px",border:"none",cursor:"pointer",fontSize:"14px",fontWeight:tab===n.id?700:500,background:tab===n.id?"#111":"transparent",color:tab===n.id?"#fff":"#6b7280",whiteSpace:"nowrap",fontFamily:"'DM Sans',sans-serif"}}>{n.label}</button>
            ))}
          </nav>
          <div style={{display:"flex",alignItems:"center",gap:"10px",flexShrink:0}}>
            <span style={{fontSize:"13px",color:"#9ca3af"}}>{jobs.length} tracked</span>
            <button onClick={()=>{S.set("rr_apikey","");setApiKey("");}} style={{background:"#f3f4f6",border:"none",borderRadius:"8px",padding:"6px 12px",fontSize:"12px",cursor:"pointer",color:"#6b7280",fontWeight:600}}>API Key</button>
          </div>
        </div>
      </header>
      {tab==="analyse"&&(
        <div style={{background:"linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%)",padding:"48px 24px 40px",textAlign:"center"}}>
          <div style={{maxWidth:"640px",margin:"0 auto"}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:"8px",background:"rgba(255,255,255,0.1)",borderRadius:"999px",padding:"6px 16px",fontSize:"13px",color:"#93c5fd",fontWeight:600,marginBottom:"20px"}}>Powered by Claude AI</div>
            <h1 style={{fontFamily:"'DM Serif Display',serif",fontSize:"clamp(28px,5vw,48px)",color:"#fff",margin:"0 0 16px",lineHeight:1.15}}>Get your resume<br/><em style={{color:"#60a5fa"}}>actually noticed</em></h1>
            <p style={{color:"#94a3b8",fontSize:"16px",lineHeight:1.6,margin:0}}>Paste your resume and any job description. Get an ATS score, missing keywords, and exact edits in seconds.</p>
          </div>
        </div>
      )}
      <main style={{maxWidth:"1100px",margin:"0 auto",padding:"40px 24px"}}>
        {tab==="analyse"&&<AnalyserView onSave={saveJob} apiKey={apiKey}/>}
        {tab==="tracker"&&<TrackerView jobs={jobs} setJobs={setJobs}/>}
        {tab==="pricing"&&<PricingView/>}
        {tab==="deploy"&&<DeployView/>}
      </main>
      <footer style={{textAlign:"center",padding:"28px",color:"#9ca3af",fontSize:"13px",borderTop:"1.5px solid #e5e7eb",background:"#fff",marginTop:"40px"}}>
        RoleReady · AI-powered job application toolkit · Your data stays in your browser · No tracking
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
